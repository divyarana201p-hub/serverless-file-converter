
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serverless File Converter</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef4ff;
    color: #1f2937;
}
.container {
    width: min(900px, 94%);
    margin: 35px auto;
    padding: 30px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 30px #1e3a8a18;
}
h1, h2 { text-align: center; }
.subtitle { text-align: center; color: #64748b; }
.panel {
    margin-top: 24px;
    padding: 22px;
    border: 1px solid #dbeafe;
    border-radius: 12px;
    background: #f8fbff;
}
label { display: block; margin: 12px 0 8px; font-weight: bold; }
input, select, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
}
button {
    background: #2563eb;
    color: white;
    border: 0;
    cursor: pointer;
    font-weight: bold;
}
button:hover { background: #1d4ed8; }
button:disabled { opacity: .6; cursor: wait; }
.message { margin-top: 12px; overflow-wrap: anywhere; }
.success { color: #15803d; }
.error { color: #b91c1c; }
ul { padding-left: 20px; }
li { margin: 12px 0; overflow-wrap: anywhere; }
a { color: #1d4ed8; }
.small { font-size: 13px; color: #64748b; }
</style>
</head>
<body>
<div class="container">
    <h1>☁️ Serverless File Converter</h1>
    <p class="subtitle">Convert and manage your files with Filebase cloud storage.</p>

    <section class="panel">
        <h2>Convert a File</h2>
        <form id="convertForm">
            <label for="file">Select file</label>
            <input id="file" name="file" type="file" required>

            <label for="conversion">Conversion type</label>
            <select id="conversion" required>
                <option value="/convert/excel-to-pdf">Excel to PDF (.xlsx, .xls)</option>
                <option value="/convert/pdf-to-excel">PDF to Excel (.pdf)</option>
                <option value="/convert/pdf-to-word">PDF to Word (.pdf to .docx)</option>
                <option value="/convert/word-to-pdf">Word to PDF (.docx)</option>
                <option value="/convert/image-to-pdf">Image to PDF (.jpg, .jpeg, .png)</option>
            </select>
            <button id="convertButton" type="submit">Convert and Save to Cloud</button>
        </form>
        <div id="convertMessage" class="message" role="status"></div>
    </section>

    <section class="panel">
        <h2>Upload a File</h2>
        <form id="uploadForm">
            <label for="uploadFile">Choose a file</label>
            <input id="uploadFile" name="file" type="file" required>
            <button id="uploadButton" type="submit">Upload to Filebase</button>
        </form>
        <div id="uploadMessage" class="message" role="status"></div>
    </section>

    <section class="panel">
        <h2>Files in Cloud Storage</h2>
        <button id="refreshButton" type="button">Refresh File List</button>
        <div id="fileListMessage" class="message" role="status"></div>
        <ul id="fileList"></ul>
    </section>

    <p class="small">Note: Scanned PDFs may not convert correctly without OCR. Complex document layouts may change during conversion.</p>
</div>

<script>
const API = "http://localhost:5000";

const convertForm = document.getElementById("convertForm");
const convertMessage = document.getElementById("convertMessage");
const convertButton = document.getElementById("convertButton");
const uploadForm = document.getElementById("uploadForm");
const uploadMessage = document.getElementById("uploadMessage");
const uploadButton = document.getElementById("uploadButton");
const fileList = document.getElementById("fileList");
const fileListMessage = document.getElementById("fileListMessage");
const refreshButton = document.getElementById("refreshButton");

function showMessage(element, message, isError = false) {
    element.textContent = message;
    element.className = "message " + (isError ? "error" : "success");
}

async function readResponse(response) {
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
        throw new Error(data.error || data.message || `Request failed (${response.status})`);
    }
    return data;
}

convertForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const file = document.getElementById("file").files[0];
    if (!file) {
        showMessage(convertMessage, "Please select a file.", true);
        return;
    }

    const route = document.getElementById("conversion").value;
    const formData = new FormData();
    formData.append("file", file);

    convertButton.disabled = true;
    showMessage(convertMessage, "Converting file. Please wait...");

    try {
        const response = await fetch(API + route, {
            method: "POST",
            body: formData
        });
        const data = await readResponse(response);

        showMessage(convertMessage, data.message || "Conversion complete.");
        await loadFiles();
    } catch (error) {
        showMessage(convertMessage, error.message, true);
        console.error("Conversion error:", error);
    } finally {
        convertButton.disabled = false;
    }
});

uploadForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const file = document.getElementById("uploadFile").files[0];
    if (!file) {
        showMessage(uploadMessage, "Please select a file.", true);
        return;
    }

    const formData = new FormData();
    formData.append("file", file);
    uploadButton.disabled = true;
    showMessage(uploadMessage, "Uploading to Filebase...");

    try {
        const response = await fetch(API + "/upload", {
            method: "POST",
            body: formData
        });
        const data = await readResponse(response);
        showMessage(uploadMessage, data.message || "Upload successful.");
        uploadForm.reset();
        await loadFiles();
    } catch (error) {
        showMessage(uploadMessage, error.message, true);
        console.error("Upload error:", error);
    } finally {
        uploadButton.disabled = false;
    }
});

async function loadFiles() {
    fileList.innerHTML = "";
    showMessage(fileListMessage, "Loading files...");

    try {
        const response = await fetch(API + "/files");
        const files = await readResponse(response);

        if (!Array.isArray(files) || files.length === 0) {
            fileListMessage.textContent = "No files available in your bucket yet.";
            fileListMessage.className = "message";
            return;
        }

        fileListMessage.textContent = `Found ${files.length} file(s).`;
        fileListMessage.className = "message success";

        files.forEach(file => {
            const item = document.createElement("li");
            const name = document.createElement("span");
            name.textContent = `${file.name} (${formatSize(file.size || 0)}) `;

            const link = document.createElement("a");
            link.href = API + "/download/" + encodeURIComponent(file.name);
            link.textContent = "Download";
            link.setAttribute("download", "");

            item.appendChild(name);
            item.appendChild(link);
            fileList.appendChild(item);
        });
    } catch (error) {
        showMessage(fileListMessage, error.message, true);
        console.error("File-list error:", error);
    }
}

function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

refreshButton.addEventListener("click", loadFiles);
loadFiles();
</script>
</body>
</html>
